<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@300;400&display=swap" rel="stylesheet">

<title>Wedding Invitation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Playfair Display', serif;
}

/* HERO */
.hero {
    height: 100vh;
    background: url('https://cdn.shopify.com/s/files/1/0727/3948/7919/files/7398173423f134d70d210d1fafc3393e.jpg?v=1774809571') no-repeat center/cover;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
}

/* OVERLAY */
.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.25);
}

/* CONTENT */
.hero-content {
    position: relative;
    z-index: 2;
    animation: fadeIn 2s ease-in-out;
}

/* NAMES */
.names {
    font-family: 'Great Vibes', cursive;
    font-size: 90px;
    animation: floatText 4s ease-in-out infinite;
}

/* DATE */
.date {
    position: absolute;
    bottom: 40px;
    width: 100%;
    text-align: center;
    font-size: 16px;
    letter-spacing: 5px;
    z-index: 2;
    animation: fadeIn 3s ease-in-out;
}

/* COUNTDOWN */
.countdown {
    position: absolute;
    bottom: 680px;
    width: 100%;
    text-align: center;
    font-size: 18px;
    letter-spacing: 3px;
    z-index: 2;
}

/* ANIMATIONS */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes floatText {
    0%, 100% {transform: translateY(0);}
    50% {transform: translateY(-10px);}
}

/* MOBILE */
@media (max-width: 768px) {
    .names {
        font-size: 50px;
    }

    .date {
        font-size: 13px;
        bottom: 20px;
    }

    .countdown {
        font-size: 14px;
        bottom: 60px;
    }
}
</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/audio/2022/10/30/audio_9467b3e6f3.mp3" type="audio/mpeg">
</audio>

<section class="hero">
    <div class="hero-content">
        <div class="names">Sophie & James</div>
    </div>

    <div class="countdown" id="countdown"></div>
    <div class="date">Saturday · 2026 · December 13</div>
</section>

<script>
const music = document.getElementById("bgMusic");

function startMusic() {
    music.play().catch(() => {});
    document.removeEventListener("click", startMusic);
    document.removeEventListener("scroll", startMusic);
}

document.addEventListener("click", startMusic);
document.addEventListener("scroll", startMusic);
    music.volume = 0.3;
// COUNTDOWN
const weddingDate = new Date("December 13, 2026 00:00:00").getTime();

const countdown = document.getElementById("countdown");

setInterval(() => {
    const now = new Date().getTime();
    const distance = weddingDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);

    countdown.innerHTML = `${days} Days · ${hours} Hours · ${minutes} Minutes`;
}, 1000);
</script>

</body>
</html>

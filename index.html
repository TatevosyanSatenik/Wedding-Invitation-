<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@300;400&display=swap" rel="stylesheet">

<title>Wedding Invitation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Playfair Display', serif;
}

/* HERO */
.hero {
    height: 100vh;
    background: url('https://cdn.shopify.com/s/files/1/0727/3948/7919/files/f4295135ae2768aaf45bb5d9f3f9ae73.jpg?v=1774809571') no-repeat center/cover;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
}

/* OVERLAY */
.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.25);
}

/* CONTENT CENTER */
.hero-content {
    position: relative;
    z-index: 2;
}

/* NAMES */
.names {
    font-family: 'Great Vibes', cursive;
    font-size: 120px;
}

/* DATE (BOTTOM) */
.date {
    position: absolute;
    bottom: 40px;
    width: 100%;
    text-align: center;
    font-size: 16px;
    letter-spacing: 5px;
    z-index: 2;
}

/* MOBILE */
@media (max-width: 768px) {
    .names {
        font-size: 50px;
    }

    .date {
        font-size: 13px;
        bottom: 25px;
    }
}
</style>
</head>

<body>

<section class="hero">
    <div class="hero-content">
        <div class="names">Sophie & James</div>
    </div>

    <div class="date">Saturday · 2026 · December 13</div>
</section>

</body>
</html>
